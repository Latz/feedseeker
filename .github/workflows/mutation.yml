name: Mutation testing

# Stryker over the whole code base, weekly rather than per push (a full run takes
# ~30 min). Fails when the mutation score drops below 90% (stryker.config.mjs).
# The incremental report is cached, so only mutants in changed code or tested by
# changed tests are rerun.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
    inputs:
      force:
        description: 'Retest every mutant (ignore the cached incremental report)'
        type: boolean
        default: false

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: 'npm'

      - run: npm ci

      # Restores the newest report; each run saves its own under a new key
      - uses: actions/cache@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.run_id }}
          restore-keys: stryker-incremental-

      - run: npm run test:mutation -- ${{ inputs.force && '--force' || '' }}

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/mutation.html
